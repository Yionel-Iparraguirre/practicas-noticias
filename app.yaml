entrypoint: serve $DOCUMENT_ROOT
runtime: php83

handlers:
  # Sirve imágenes y archivos estáticos (agregué css, js, svg y webp por si los usas)
  - url: /(.+\.(gif|png|jpg|jpeg|webp|svg|css|js))$
    static_files: \1
    upload: .+\.(gif|png|jpg|jpeg|webp|svg|css|js)$

  # Enruta la raíz y cualquier archivo .php automáticamente
  - url: /.*
    script: auto
